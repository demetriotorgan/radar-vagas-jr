name: Radar Vagas Jr
on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Instala dependencias
        run: pip install -r requirements.txt
      - name: Roda o radar
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py
      - name: Salva banco atualizado
        run: |
          git config user.name "github-actions"
          git config user.email "action@github.com"
          git add vagas.duckdb || echo "sem db pra salvar"
          git diff --staged --quiet || git commit -m "auto: atualiza banco de vagas"
          git push || echo "sem push necessario"
