name: Radar Vagas Jr
on:
  schedule:
    - cron: '0 11:00 * * *'  # 08:00 no Brasil
  workflow_dispatch:  # permite rodar manual também

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Roda o radar
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py
      - name: Salva banco atualizado
        run: |
          git config user.name "github-actions"
          git config user.email "action@github.com"
          git add vagas.duckdb
          git commit -m "auto: atualiza banco de vagas" || echo "nada novo"
          git push
